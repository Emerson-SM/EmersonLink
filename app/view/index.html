<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Acortador de URLs</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-gray-900 text-gray-100 flex items-center justify-center h-screen">
        <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md">
            <h1 class="text-2xl font-bold mb-6 text-center">Acortador de URLs</h1>
            
            <form id="urlForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">URL a acortar:</label>
                    <input type="url" id="urlInput" required placeholder="https://ejemplo.com"
                        class="w-full px-4 py-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded font-semibold transition">
                    Acortar URL
                </button>
            </form>

            <div id="result" class="mt-6 hidden p-4 bg-gray-700 rounded-lg text-center">
                <p class="text-sm text-gray-300">URL acortada con éxito:</p>
                <a id="shortLink" href="#" target="_blank" class="text-indigo-400 font-bold underline break-all"></a>
            </div>
        </div>

        <script>
            document.getElementById('urlForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const url = document.getElementById('urlInput').value;

                const response = await fetch('/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                if (response.ok) {
                    const data = await response.json();
                    const fullUrl = window.location.origin + data.short_url;
                    
                    const resultDiv = document.getElementById('result');
                    const shortLink = document.getElementById('shortLink');
                    
                    shortLink.href = fullUrl;
                    shortLink.textContent = fullUrl;
                    resultDiv.classList.remove('hidden');
                } else {
                    alert('Error al acortar la URL');
                }
            });
        </script>
    </body>
    </html>
